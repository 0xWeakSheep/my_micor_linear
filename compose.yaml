services:
  micro-linear:
    build: .
    restart: unless-stopped
    env_file:
      - ./deploy/micro-linear.env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - orbit-data:/app/.data

volumes:
  # Stable key retained so existing Compose installations keep their data volume.
  orbit-data:
